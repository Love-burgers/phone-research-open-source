name: chat-tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_chat_ui.cjs
      - run: python -m scripts.evaluate_chat --output-directory runs/ci-chat
      - run: python -m scripts.evaluate_intent --output runs/ci-intent.json
      - run: python -m scripts.evaluate_rag_quality --output-directory runs/ci-rag
      - run: python -m pip install build
      - run: python -m build
      - run: python -c "import pathlib,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',*map(str,pathlib.Path('dist').glob('*.whl'))])"
      - run: phone-chat --help
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-validation-${{ matrix.os }}
          path: runs/ci-*
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t phone-chat-check .
      - run: docker run --rm phone-chat-check phone-chat --help
