[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-chat-assistant"
version = "0.4.0"
description = "Multi-turn phone selection assistant with LangChain, RAG and LangGraph"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "ddgs>=9,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain>=1.4,<2",
  "langchain-openai>=1.7,<2",
  "langchain-deepseek>=1.1,<2",
  "langchain-text-splitters>=1.1,<2",
  "langgraph>=1.2.14,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "rank-bm25>=0.2.2,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
eval = ["fastembed>=0.7,<0.8"]
local = ["fastembed>=0.7,<0.8"]

[project.scripts]
phone-chat = "app.chat_cli:main"
phone-knowledge = "app.knowledge_cli:main"

[tool.setuptools]
packages = ["app", "app.static", "app.knowledge_samples"]
include-package-data = false
py-modules = ["main"]

[tool.setuptools.package-data]
app = ["static/*.html"]
"app.knowledge_samples" = ["selection_index.json", "selection_catalog.json", "public_source_directory.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
